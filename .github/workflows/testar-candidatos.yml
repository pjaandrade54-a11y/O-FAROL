# Testa os feeds de ferramentas/candidatos.json antes de cadastrar os veículos (não publica nada).
name: Testar veículos candidatos

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["ferramentas/candidatos.json", "ferramentas/testar_candidatos.py"]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ferramentas/testar_candidatos.py ferramentas/candidatos.json
