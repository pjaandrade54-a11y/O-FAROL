# Testa feeds sem publicar nada: os candidatos de ferramentas/candidatos.json (antes de cadastrar)
# ou, escolhendo "cadastrados", os feeds de dados/veiculos.json.
name: Testar veículos candidatos

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Quais feeds testar"
        type: choice
        options: [ferramentas/candidatos.json, dados/veiculos.json]
        default: ferramentas/candidatos.json

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ferramentas/testar_candidatos.py ${{ inputs.arquivo }}
