# Coleta as notícias, roda o conselho de IA e publica o site no GitHub Pages, sem servidor próprio.
# Roda a cada 30 minutos, a cada envio de código para a branch main e pelo botão "Run workflow".

name: Coletar notícias e publicar o site

on:
  schedule:
    # Minutos 7 e 37 (UTC): fora da virada da hora, quando o GitHub atrasa ou pula mais execuções agendadas
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write      # o conselho de IA abre um caso (issue) para cada notícia que vai ao conselho humano
  models: read       # o conselho de IA usa os modelos gratuitos do GitHub Models
  pages: write
  id-token: write

concurrency:
  group: coletar-e-publicar
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O banco (dados/farol.db) não vai para o repositório: ele passa de uma coleta para a outra pelo cache
      - name: Recuperar o banco da última coleta
        uses: actions/cache/restore@v4
        with:
          path: dados/farol.db
          key: farol-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: farol-db-

      - name: Instalar os pacotes dos modelos de IA
        run: pip install --quiet "anthropic>=2.3,<3" "openai>=3.41,<4"

      - name: Rodar os testes
        run: python -m unittest discover -s tests

      - name: Coletar notícias
        run: python -m coletor coletar

      # Por padrão usa os modelos gratuitos do GitHub Models; IA_PROVEDOR=anthropic usa as chaves pagas
      - name: Conselho de IA
        run: python -m coletor analisar
        continue-on-error: true   # se a IA falhar, o site é publicado assim mesmo, com as notícias novas
        env:
          IA_PROVEDOR: ${{ vars.IA_PROVEDOR }}
          GITHUB_MODELO_ACUSACAO: ${{ vars.GITHUB_MODELO_ACUSACAO }}
          GITHUB_MODELO_DEFESA: ${{ vars.GITHUB_MODELO_DEFESA }}
          GITHUB_MODELO_FONTES: ${{ vars.GITHUB_MODELO_FONTES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_MODELO: ${{ vars.CLAUDE_MODELO }}
          OPENAI_MODELO: ${{ vars.OPENAI_MODELO }}
          IA_ESFORCO: ${{ vars.IA_ESFORCO }}
          IA_POR_EXECUCAO: ${{ vars.IA_POR_EXECUCAO }}
          IA_POR_DIA: ${{ vars.IA_POR_DIA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar o banco para a próxima coleta
        if: always() && hashFiles('dados/farol.db') != ''
        uses: actions/cache/save@v4
        with:
          path: dados/farol.db
          key: farol-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Montar o site
        run: |
          mkdir -p _site/dados
          cp *.html _site/
          cp -r css js img _site/
          cp dados/noticias.json _site/dados/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: publicar
        uses: actions/deploy-pages@v4
